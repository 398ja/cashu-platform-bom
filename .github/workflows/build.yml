name: CI Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install BOM locally
        run: mvn -B -f pom.xml clean install

      - name: Build aggregated modules
        run: mvn -B -f aggregate/pom.xml -T 1C clean verify

