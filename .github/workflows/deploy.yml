name: Deploy

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target repository'
        required: true
        default: 'releases'
        type: choice
        options: ['releases', 'snapshots']
  push:
    tags:
      - 'v*'

env:
  RELEASES_URL: https://maven.398ja.xyz/releases
  SNAPSHOTS_URL: https://maven.398ja.xyz/snapshots

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment is derived from the same rule the `Determine channel` step applies: a tag
    # push deploys to releases, a manual run deploys to whatever the operator chose.
    #
    # It cannot read that step's output. `environment:` is evaluated before the job starts, so the
    # `steps` context does not exist yet -- only github, inputs, matrix, needs, strategy and vars
    # do. The previous `${{ steps.chan.outputs.channel }}` made the whole file invalid, which is
    # why this workflow had never run: 17 runs, 0 jobs, 0 successes, and GitHub listing it by path
    # instead of by name because it could not parse it far enough to read `name:`.
    environment: ${{ github.event_name == 'push' && 'releases' || inputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Determine channel
        id: chan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "channel=releases" >> $GITHUB_OUTPUT
          else
            echo "channel=${{ inputs.channel }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate tag format (push events)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "Tag '$REF' does not match vMAJOR.MINOR.PATCH[[-|.]suffix]"
            exit 1
          fi

      - name: Set env vars
        id: setenv
        shell: bash
        run: |
          if [[ "${{ steps.chan.outputs.channel }}" == "releases" ]]; then
            echo "SERVER_ID=reposilite-releases" >> $GITHUB_ENV
            echo "REPO_URL=${{ env.RELEASES_URL }}" >> $GITHUB_ENV
          else
            echo "SERVER_ID=reposilite-snapshots" >> $GITHUB_ENV
            echo "REPO_URL=${{ env.SNAPSHOTS_URL }}" >> $GITHUB_ENV
          fi

      - name: Setup Java 21 + Maven server credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Same derivation as `environment:` above rather than env.SERVER_ID. `with:` is
          # evaluated when the step starts, and SERVER_ID is written to $GITHUB_ENV by an earlier
          # step, so it does resolve -- but repeating the rule from a context that is always
          # available removes the ordering dependency, which is what made this fragile.
          server-id: ${{ github.event_name == 'push' && 'reposilite-releases' || (inputs.channel == 'releases' && 'reposilite-releases' || 'reposilite-snapshots') }}
          server-username: ${{ secrets.REPO_USER }}
          server-password: ${{ secrets.REPO_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install BOM locally
        run: mvn -B -f pom.xml clean install

      - name: Deploy aggregated modules
        run: mvn -B -f aggregate/pom.xml -T 1C -DskipTests -DaltDeploymentRepository="${SERVER_ID}::default::${REPO_URL}" deploy
